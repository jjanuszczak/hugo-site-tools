baseURL = "https://jjanuszczak.github.io/hugo-site-tools/"
title = "hs documentation"
enableRobotsTXT = true

[params]
  description = "Documentation for hs, the Hugo site toolkit."
  github_repo = "https://github.com/jjanuszczak/hugo-site-tools"
  github_project_repo = "https://github.com/jjanuszczak/hugo-site-tools"
  github_branch = "main"
  offlineSearch = true

[params.ui]
  breadcrumb_disable = false
  sidebar_menu_compact = true
  sidebar_search_disable = false

[params.ui.feedback]
  enable = true
  yes = "https://github.com/jjanuszczak/hugo-site-tools/issues/new"
  no = "https://github.com/jjanuszczak/hugo-site-tools/issues/new"

[module]
  proxy = "direct"
  [module.hugoVersion]
    extended = true
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/google/docsy"

[[menu.main]]
  name = "GitHub"
  weight = 50
  url = "https://github.com/jjanuszczak/hugo-site-tools"
  pre = "<i class='fab fa-github'></i>"
