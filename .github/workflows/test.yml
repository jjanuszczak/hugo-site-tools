name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true
      - run: go test ./...
      - run: go vet ./...
      # golangci-lint reads .golangci.yml at the repository root. Pin the
      # version so CI and local runs use the same rule set and analyzer
      # behavior; bump both together when upgrading the linter.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
